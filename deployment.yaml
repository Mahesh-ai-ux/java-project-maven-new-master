apiVersion: apps/v1
kind: Deployment
metadata:
  name: maven-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maven
  template:
    metadata:
      labels:
        app: maven
    spec:
      containers:
      - name: maven-container
        image: 619071341744.dkr.ecr.ap-south-2.amazonaws.com/maven-app:latest
        ports:
        - containerPort: 8080
